bundle:
  name: datacart-storefront-data-centric
  engine: direct

# Single source of truth for the Lakebase project + endpoint. Every attendee
# gets their own project (one per user id); these vars are referenced by the
# postgres_project resource, the app's Lakebase binding, and the app env.
variables:
  project_id:
    description: Lakebase project slug — one per workshop attendee.
    default: zerobus-lakebase-${workspace.current_user.id}
  endpoint_name:
    description: Full resource path of the project's production read-write endpoint.
    default: projects/${var.project_id}/branches/production/endpoints/primary
  # --- Zerobus clickstream producer (optional; see Lab 5.1) -----------------
  # Off by default — no lab requires it. To wire the storefront to push its
  # clickstream in live via Zerobus, flip zerobus_enabled=true and set the
  # endpoint + a bronze target table (e.g. via `databricks bundle deploy --var=...`).
  zerobus_enabled:
    description: Enable the storefront's Zerobus clickstream producer.
    default: "false"
  zerobus_endpoint:
    description: Region-specific Zerobus server endpoint (https://<workspace-id>.zerobus.<region>.cloud.databricks.com).
    # Non-empty sentinel: the Apps API rejects empty env `value: ""`. The producer
    # ignores this entirely while zerobus_enabled is "false".
    default: "unset"
  zerobus_bronze_table:
    description: Fully-qualified UC bronze target (<catalog>.ecommerce.clickstream_bronze).
    default: "unset"

include:
  - resources/*.yml

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
